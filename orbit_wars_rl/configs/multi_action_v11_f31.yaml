# v11_f31 — f29 signals + hard anti-spam masks (Day7 Phase B).
#
# Same f29 signal stack (dst+margin, emit_worth_it, pct hard mask).
# NEW: emit_hard_stop + flip_hard_mask (block uncapturable dst).
# Fresh train 600 upd, no buffer, no BC. seed=311.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 600
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f31
  ckpt_every: 100
  log_every: 1
  seed: 311
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000
  lr_decay_steps: 150000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.008
  ent_coef_emit: 0.002
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
