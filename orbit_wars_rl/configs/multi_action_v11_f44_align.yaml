# v11_f44_align — train/replay alignment experiment (Day11 P0–P4).
#
# Same shaping as f42 (CAPTURE_FLEET_SCALE), resume f42 @49 replay-best.
# Infrastructure + distribution fixes (not new reward terms):
#   P0: ckpt .meta.json records opp_tag + align + eval_vs_v20
#   P1: log align[strn+frzn] rolling mean (align_roll_window=20)
#   P2: eval_vs_v20 every eval_every (3 games CPU replay)
#   P3: buffer_rollout_ratio 0.40 -> 0.15
#   P4: strong_ratio 0.25 -> 0.35
#
# Promote / early-stop on eval_vs_v20/* metrics, NOT raw spf/e2 on buf rollouts.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 500
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f44_align
  ckpt_every: 50
  log_every: 1
  seed: 440
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true
  align_roll_window: 20
  eval_vs_v20: true
  eval_vs_v20_num_games: 3

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 2000
  lr_decay_steps: 500000
  lr_floor: 0.00001
  clip_eps: 0.20
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.03
  ent_coef_dst: 0.03
  ent_coef_pct: 0.03
  ent_coef_emit: 0.04
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 1
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 0
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.25
  eval_vs_frozen: true
  strong_ckpt_path: ./ckpt_multi_action_v11_f29/ckpt_000599.pkl
  strong_ratio: 0.35
  pool_seed_paths:
    - ./ckpt_multi_action_v11_f29/ckpt_000599.pkl
  snapshot_current: false
  buffer_path: data/f40_mixed_states.npz
  buffer_reset_ratio: 0.80
  buffer_rollout_ratio: 0.15
