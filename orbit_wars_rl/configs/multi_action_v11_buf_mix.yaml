# v11 Plan B mix — v20 + top10 balanced state buffer, resume from buf_from4k.
#
# Prerequisite (5090):
#   bash scripts/build_mixed_buffer.sh
#   bash scripts/run_v11_plan_b_mix.sh
#
# Same Plan B mechanics as buf_from4k: episode reset samples mid-game states;
# no action imitation. Mixed pool = 50/50 v20 self-play + top10 winner JSON.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 800
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_buf_mix
  ckpt_every: 100
  log_every: 1
  seed: 222
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.00006
  lr_warmup_steps: 200
  lr_decay_steps: 80000
  lr_floor: 0.000005
  clip_eps: 0.12
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.002
  ent_coef_dst: 0.001
  ent_coef_pct: 0.003
  ent_coef_emit: 0.002
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 0
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.50
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
  buffer_path: "data/mixed_v20_top10.npz"
  buffer_reset_ratio: 0.50
