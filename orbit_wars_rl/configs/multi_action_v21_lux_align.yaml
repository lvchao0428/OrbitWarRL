# v21: Lux-aligned architecture — from scratch, sparse reward, symmetric self-play
#
# Key changes from v19:
#   - Reward: terminal ±1 only + capture 0.02 constant (all other shaping off)
#   - Self-play: pure symmetric (same model controls both players)
#   - Features: ETA-lead to all heads, future garrison prediction, planet spatial hist,
#               multi-planet coordination signals in EmitHead
#   - Training: from scratch (no resume), 4-hour budget (~15000 updates)
#   - Zero-sum value head (sees both players' observations)

train:
  num_envs: 64
  rollout_length: 32
  num_updates: 15000
  num_groups: 5
  episode_steps: 500
  wins_needed: 2
  eval_every: 100
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v21_lux_align
  ckpt_every: 200
  log_every: 1
  seed: 2100
  d_model: 256
  n_layers: 4
  n_heads: 8
  ff_dim: 1024
  max_fleets_per_turn: 8
  emit_hard_stop: true
  emit_hard_stop_min_step: 2
  flip_hard_mask: false
  allow_hold: false
  force_emit_worth_it: false
  min_pct_bin: 0
  align_roll_window: 50
  eval_vs_v20: true
  eval_vs_v20_num_games: 5
  symmetric_selfplay: true
  symmetric_warmup: 0
  zero_sum_value: true
  resume_ckpt: ""

ppo:
  lr_peak: 0.0001
  lr_warmup_steps: 200
  lr_decay_steps: 150000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.25
  value_coef: 0.5
  ent_coef_src: 0.0005
  ent_coef_dst: 0.0005
  ent_coef_pct: 0.0005
  ent_coef_emit: 0.002
  max_grad_norm: 0.5
  gamma: 0.9999
  gae_lambda: 0.9
  update_epochs: 1
  num_minibatches: 8
  target_kl: 0.03

selfplay:
  enabled: false
