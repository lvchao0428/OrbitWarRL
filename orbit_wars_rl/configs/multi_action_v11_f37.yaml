# v11_f37 — strengthen fundamental action signals + pure terminal reward.
#
# Deltas vs f35/f33:
#   - GLOBAL_FEAT_DIM 17 -> 18  (+min_effective_fleet_norm)
#   - EMIT_PAIR_DIM 4 -> 6      (+feasible_target_count_norm, +surplus_ratio)
#   - All reward shaping = 0 (pure +1/-1 terminal)
#   - num_updates = 3000 (~100M steps, Lin Myat Ko baseline)
#   - ckpt_every = 100
#   - frozen_ratio = 0.40, no strong opponent (shape compat issue)
#
# PPO recipe: same as f33 (top-player aligned).
# Fresh train, no buffer, no BC. seed=370.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 3000
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f37
  ckpt_every: 100
  log_every: 1
  seed: 370
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 2000
  lr_decay_steps: 500000
  lr_floor: 0.00001
  clip_eps: 0.20
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.05
  ent_coef_dst: 0.05
  ent_coef_pct: 0.05
  ent_coef_emit: 0.05
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 1
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
