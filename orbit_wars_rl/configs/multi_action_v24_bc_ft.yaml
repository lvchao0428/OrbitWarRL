# v24: PPO fine-tune from the v20 BC clone (P1 of the BC roadmap).
#
# Init   : resume_ckpt = BC clone (flip + multi-emit already in the policy)
# Anchor : KL(pi_theta || pi_BC) with kl_ref_coef, prevents collapse back to
#          turtling / multi-spam local optima
# Opp    : BC net as strong opponent 40% + frozen pool (seeded with BC) 30%
#          + rand 30%
# Masks  : faithful to BC -- no emit_hard_stop, no min_pct_bin, allow_hold
# Reward : v23 set (flip-gated capture + fleet_scale + multi_emit + anti_hoard)
#          via launch script env vars
# Match  : wins_needed=1 (single match, same distribution as BC data + kaggle)

train:
  num_envs: 64
  rollout_length: 32
  num_updates: 4000
  num_groups: 5
  episode_steps: 500
  wins_needed: 1
  eval_every: 100
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v24_bc_ft
  ckpt_every: 200
  log_every: 1
  seed: 2400
  d_model: 256
  n_layers: 4
  n_heads: 8
  ff_dim: 1024
  max_fleets_per_turn: 8
  emit_hard_stop: false
  emit_hard_stop_min_step: 0
  flip_hard_mask: false
  allow_hold: true
  force_emit_worth_it: false
  min_pct_bin: 0
  align_roll_window: 50
  eval_vs_v20: true
  eval_vs_v20_num_games: 5
  symmetric_selfplay: false
  symmetric_warmup: 0
  zero_sum_value: true
  resume_ckpt: ./ckpt_bc_v20_epw25/ckpt_final.pkl
  bc_anchor_ckpt: ./ckpt_bc_v20_epw25/ckpt_final.pkl

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 100
  lr_decay_steps: 40000
  lr_floor: 0.000005
  clip_eps: 0.10
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.0003
  ent_coef_dst: 0.0003
  ent_coef_pct: 0.0003
  ent_coef_emit: 0.0005
  max_grad_norm: 0.5
  gamma: 0.9999
  gae_lambda: 0.85
  update_epochs: 1
  num_minibatches: 8
  target_kl: 0.02
  kl_ref_coef: 0.05

selfplay:
  enabled: true
  warmup_updates: 0
  snapshot_every: 400
  pool_capacity: 8
  frozen_ratio: 0.30
  eval_vs_frozen: true
  strong_ckpt_path: ./ckpt_bc_v20_epw25/ckpt_final.pkl
  strong_ratio: 0.40
  pool_seed_paths:
    - ./ckpt_bc_v20_epw25/ckpt_final.pkl
  snapshot_current: false
  buffer_path: ""
  buffer_reset_ratio: 0.0
  buffer_rollout_ratio: 0.0
