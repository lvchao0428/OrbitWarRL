# v11_f36a — Day9 route 3A: action mechanism delta only.
#
# Goal: break the n1≈99% / e2+=0% attractor without changing observation
# features, model size, PPO, or training distribution.
#
# Single delta vs f33:
#   emit_hard_stop_min_step: 1 -> 2
#
# Interpretation:
#   keep the f31/f33 hard-stop idea, but do NOT let the worth_it gate hard-stop
#   the policy on the 2nd emit slot. The 2nd fleet remains a free policy choice;
#   the hard stop only kicks in from step 2 onward.
#
# Everything else stays frozen to the stable pre-f35 stack.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 350
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f36a
  ckpt_every: 50
  log_every: 1
  seed: 361
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  emit_hard_stop_min_step: 2
  flip_hard_mask: true

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 2000
  lr_decay_steps: 500000
  lr_floor: 0.00001
  clip_eps: 0.20
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.05
  ent_coef_dst: 0.05
  ent_coef_pct: 0.05
  ent_coef_emit: 0.05
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 1
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
