# v11_f38 stage 3 — pure terminal reward + f29@599 external anchor.
# Resume from stage 2 ckpt @499. Runs 2000 more updates (total 3000).

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 2000
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f38_s3
