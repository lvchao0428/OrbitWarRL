# v11_f38 — curriculum: shaped reward bootstrap -> anneal -> pure terminal + anchor.
#
# Three-stage training (managed by run_v11_f38.sh):
#   Stage 1 (0-500 upd):   CAPTURE=0.05, PROD_SHARE_DELTA=0.02
#   Stage 2 (500-1000 upd): CAPTURE=0.025, PROD_SHARE_DELTA=0.01 (halved)
#   Stage 3 (1000-3000 upd): all shaping=0 + f29@599 as strong anchor
#
# Feature dims: same as f37 (planet=33, global=18, emit_pair=6).
# PPO recipe: same as f37 (top-player aligned, ent_coef=0.05 uniform).
# Self-play: warmup 50, frozen 0.40. Strong anchor added in stage 3.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 500
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f38
  ckpt_every: 100
  log_every: 1
  seed: 380
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 2000
  lr_decay_steps: 500000
  lr_floor: 0.00001
  clip_eps: 0.20
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.05
  ent_coef_dst: 0.05
  ent_coef_pct: 0.05
  ent_coef_emit: 0.05
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 1
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
