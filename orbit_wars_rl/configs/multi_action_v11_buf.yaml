# v11 + buffer-reset curriculum (Plan B).
#
# Uses the same architecture/rewards as v11 (K=8 variant, R4 OFF) but
# seeds episode resets from a pre-collected v20 self-play state buffer.
# Collect the buffer first:
#
#   python -m orbit_wars_rl.bc.collect_states \
#       --agent submission_v20_0513.py \
#       --num-games 200 \
#       --out data/v20_states_200g.npz
#
# Then train:
#
#   SHAPING_EMIT_LOG=0.0 \
#   python -m orbit_wars_rl.scripts.train \
#       --config orbit_wars_rl/configs/multi_action_v11_buf.yaml \
#       --log-dir logs/v11_buf_run1
#
# buffer_path is set via selfplay.buffer_path below; override at CLI if needed.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 800
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_buf
  ckpt_every: 100
  log_every: 1
  seed: 220
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8   # K=8 (ablation default)

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000
  lr_decay_steps: 150000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.003
  ent_coef_emit: 0.003
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.50
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
  # Plan B: v20 state-buffer curriculum.
  # Set buffer_path to the .npz from collect_states.py.
  # buffer_reset_ratio=0.30 means 30% of episode resets use a v20 state.
  buffer_path: "data/v20_states_200g.npz"
  buffer_reset_ratio: 0.30
