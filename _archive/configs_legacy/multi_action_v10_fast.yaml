# v10 FAST template -- shared by R1/R2/R4/combo runs.
#
# Day5 FAST lane: cap at 1000 updates so a serial loop can probe a recipe
# in ~75min on a 5090 (vs 5h for full 4000). The gate script
# (orbit_wars_rl.scripts.check_fast_gate) is polled by run_fast_serial.sh
# every few minutes and may KILL / PROMOTE before this cap is hit.
#
# All other knobs match v9b exactly so any signal we see is attributable
# to the new shaping coefficients passed via ORBITWARS_SHAPING_* env vars.
#
# DO NOT add per-variant settings here -- the per-variant differences live
# entirely in the env vars set by run_fast_serial.sh.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 1000
  num_groups: 5
  episode_steps: 350
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v10_fast
  ckpt_every: 100
  log_every: 1
  seed: 100
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000
  lr_decay_steps: 100000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.003
  ent_coef_emit: 0.003
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.5
  eval_vs_frozen: true
