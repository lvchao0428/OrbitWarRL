# v11_f32 — speed-aware pair features + relaxed hard masks (Day7 Phase C).
#
# f31 problem: hard masks at bin5 (70%) made model over-conservative.
#   z0=2%, emit=1.08, flip=1%, WLD=0/5 vs v20.
#
# f32 changes:
#   - dst_pair: +speed_norm +eta_norm (DST_PAIR_DIM 5->7)
#   - emit_pair: +feasible_avg_speed_norm (EMIT_PAIR_DIM 4->5)
#   - flip_hard_mask threshold: 70% -> 40% (bin3)
#   - emit_hard_stop: worth_it now checks bin3 not bin5
#   - reward shaping: FLEET_LOG=0.005, RELEASE=0.003
# Fresh train 600 upd, no buffer, no BC. seed=321.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 600
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f32
  ckpt_every: 100
  log_every: 1
  seed: 321
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000
  lr_decay_steps: 150000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.008
  ent_coef_emit: 0.002
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
