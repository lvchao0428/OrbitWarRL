# v5.1 - shaping killed AND per-head entropy coef rebalanced.
#
# Use when v5p0 early data shows shaping=0 alone is not enough -- i.e.
# at upd 100 mean_emits is still <2.5 or ent_pct still >1.20.
#
# Changes vs v5p0:
#   ent_coef_pct: 0.02 -> 0.001   (10x weaker; pct space is only 4 bins)
#   ent_coef_emit: 0.03 -> 0.003  (10x weaker; emit space is 2 bins)
#   ent_coef_src:  0.005 -> 0.002 (small reduction; src is 20-dim like dst)
#   ent_coef_dst:  0.0003 -> 0.0001 (continue committing dst)
#
# These match the proportions that worked for v3.2->v3.x progression
# scaled down for smaller action spaces. The pct=0.001 number is
# specifically chosen so a 4-bin uniform-entropy bonus of 1.4*0.001 =
# 0.0014 is ~ same magnitude as the pg_loss we want to see (-0.001),
# letting policy gradient win over entropy.
#
# Launch:
#   ORBITWARS_SHAPING_SCALE=0.0 \
#       python -m orbit_wars_rl.scripts.train \
#       --config orbit_wars_rl/configs/multi_action_v5p1.yaml \
#       --log-dir logs/multi_action_v5p1 \
#       2>&1 | tee logs/multi_action_v5p1.log

train:
  num_envs: 64
  rollout_length: 128
  num_updates: 600
  num_groups: 5
  episode_steps: 250
  eval_every: 10
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v5p1
  ckpt_every: 25
  log_every: 1
  seed: 51
  d_model: 64
  n_layers: 2
  n_heads: 4
  ff_dim: 128
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.0003
  lr_warmup_steps: 60
  lr_decay_steps: 600
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.5
  ent_coef_src: 0.002    # 0.005 -> 0.002
  ent_coef_dst: 0.0001   # 0.0003 -> 0.0001
  ent_coef_pct: 0.001    # 0.02 -> 0.001  (key: 20x weaker, pct only has 4 bins)
  ent_coef_emit: 0.003   # 0.03 -> 0.003  (key: 10x weaker, emit only has 2 bins)
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 4

selfplay:
  enabled: true
  warmup_updates: 80
  snapshot_every: 20
  pool_capacity: 6
  frozen_ratio: 0.5
  eval_vs_frozen: true
