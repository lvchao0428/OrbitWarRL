# v6p2 - fix lr schedule bug discovered at v6 upd 383.
#
# THE BUG (uncovered 2026-05-23 ~12:50 AM):
#   optax.warmup_cosine_decay_schedule takes `warmup_steps` and `decay_steps`
#   in OPTIMIZER STEPS, not PPO updates. Each PPO update runs
#   `update_epochs * num_minibatches = 4 * 4 = 16` optimizer steps. So:
#     lr_warmup_steps: 120  -> ~7.5 PPO updates of warmup  (we wanted 120)
#     lr_decay_steps:  6000 -> ~375 PPO updates of decay   (we wanted 6000)
#
#   v6 ran to upd 383 = 6128 optimizer steps -- ALREADY PAST decay_steps,
#   so lr was at floor (1e-5) for the last ~10 updates. That's a 15x lr
#   reduction. Observable symptoms at upd 350-383:
#     clip: 0.11 -> 0.02   (policy not stepping)
#     kl:   0.005 -> 0.001 (policy not updating)
#     pg:   -0.007 -> -0.003 (signal halved)
#     emits: 2.6 -> 2.0    (regression back toward MVP behavior)
#   Same fingerprint as v5p2 "value head outran policy", but cause is lr=0.
#
# RETROSPECTIVE: this bug bit every v3-v5 config in our history. All of them
# wrote `lr_decay_steps` in "PPO updates" units but optax interprets it as
# optimizer steps (16x ratio). Most v3-v4 runs were killed within 30-50 of
# the early updates and never saw it bite. v5p3 was killed at upd 144 of an
# intended 800-update run; we now know the "second-half regression" we saw
# starting at upd 30 was lr hitting floor (decay_steps=2400 = 150 PPO
# updates), not "value head outran policy" as previously diagnosed.
#
# THE FIX:
#   Scale both numbers by ~16x so they map to the intended *PPO update* counts.
#     lr_warmup_steps: 120 -> 2000  (~125 PPO updates of warmup)
#     lr_decay_steps:  6000 -> 100000 (~6250 PPO updates, > num_updates=5000)
#   With decay_steps > num_updates, lr stays close to peak for the whole run
#   (cosine over a horizon we never finish = essentially constant). This is
#   what v5p3.yaml accidentally got right: lr_decay_steps=2400 was still
#   wrong in absolute terms but happened to land lr near 70-80% of peak for
#   the 144 updates it ran.
#
# STRATEGY:
#   Resume from v6's best checkpoint (upd ~191, when emits peaked at 2.6+
#   and clip was healthy). We keep v6's already-good policy and just give
#   it back the learning signal it lost. If checkpoint is unavailable, the
#   sane fallback is fresh training from seed=62.
#
# Launch:
#   pkill -f multi_action_v6 2>/dev/null
#   # Pick the highest available v6 checkpoint at or before upd ~200 to
#   # avoid resuming from the lr-dead final state:
#   ls ckpt_multi_action_v6/ckpt_*.pkl | sort | head -10
#   # Use the one nearest to upd 199 (ckpt_every=50 -> 199, 249, etc.)
#   # If only 099/049 exist, use the highest:
#   RESUME_CKPT="ckpt_multi_action_v6/ckpt_000199.pkl"
#
#   ORBITWARS_SHAPING_SCALE=0.0 \
#       nohup python -m orbit_wars_rl.scripts.train \
#       --config orbit_wars_rl/configs/multi_action_v6p2.yaml \
#       --resume-from "$RESUME_CKPT" \
#       --log-dir logs/multi_action_v6p2 \
#       > logs/multi_action_v6p2.log 2>&1 &
#
#   tail -f logs/multi_action_v6p2.log
#
# Sign-of-life:
#   - First 5 updates after resume: clip should jump back to 0.05+, kl > 0.003
#   - upd 50: emits back to 2.5+
#   - upd 200: emits > 3.0, WRr > 0.85, WRf > 0.65
#   - upd 500: H2H vs v20 has at least 1 win
#
# Kill triggers:
#   - clip > 0.30 sustained 5+ updates -> lr_peak still too high, halve
#   - emits drops back below 2.0 -> resume ckpt was actually dead, restart fresh

train:
  num_envs: 128
  rollout_length: 128
  num_updates: 5000
  num_groups: 5
  episode_steps: 80
  eval_every: 25
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v6p2
  ckpt_every: 50
  log_every: 1
  seed: 62
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000      # KEY: ~125 PPO updates (was 120 -> ~7.5 updates)
  lr_decay_steps: 100000     # KEY: > num_updates * 16 so lr stays near peak
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.0001
  ent_coef_pct: 0.003
  ent_coef_emit: 0.003
  max_grad_norm: 0.5
  gamma: 0.97
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 4

selfplay:
  enabled: true
  warmup_updates: 50         # already past v6's warmup; small grace period
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.5
  eval_vs_frozen: true
