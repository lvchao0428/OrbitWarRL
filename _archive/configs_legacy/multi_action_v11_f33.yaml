# v11_f33 — hyperparams aligned to top player (Lin Myat Ko, 5th) + longer train.
#
# Single delta vs f31: PPO hyperparams + training volume only.
#   arch / pair features / hard masks are FROZEN to f31 (5+4 pair, flip bin5,
#   emit_hard_stop + flip_hard_mask). NO f32 speed/eta features.
#
# Rationale (top_players_rl.txt + DAY8): f30/f31/f32 never beat f29 (replay).
# Bet that the gap is under-training + mis-tuned PPO, not missing features.
#
# Top-player PPO recipe applied:
#   - single ent_coef = 0.05 (we set all four heads to 0.05)
#   - lr_peak = 3e-5      (was 1.5e-4, 5x lower -> more stable)
#   - update_epochs = 1   (was 4, avoid overfitting the rollout)
#   - clip_eps = 0.20     (was 0.15)
#   - value_coef = 0.5    (was 0.20, stronger value learning)
#   - num_updates = 2000  (was 600, ~65M steps; top player ran ~600M)
#
# clip_frac is the warning sign: monitor each ~200 upd; if it creeps past 0.25
# monotonically, cut lr (2e-5/1e-5) or revert. See scripts/check_training_health.sh.
#
# Fresh train, no buffer, no BC. seed=331.

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 2000
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f33
  ckpt_every: 200
  log_every: 1
  seed: 331
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: true
  flip_hard_mask: true

ppo:
  lr_peak: 0.00003
  lr_warmup_steps: 2000
  lr_decay_steps: 500000
  lr_floor: 0.00001
  clip_eps: 0.20
  value_clip_eps: 0.20
  value_coef: 0.5
  ent_coef_src: 0.05
  ent_coef_dst: 0.05
  ent_coef_pct: 0.05
  ent_coef_emit: 0.05
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 1
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
