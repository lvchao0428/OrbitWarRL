# v11_f30 — f29 @599 extension (Day7+).
#
# Same f29 signal stack (dst+margin, emit_worth_it, pct hard mask).
# No buffer, no emit_hard_stop. Resume f29 ckpt_000599.pkl, 800 more upd.
#
# Goal: keep bin0 <15%, push flip >6% and garr >60 (f29@599: flip=3% garr=45).

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 800
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f30
  ckpt_every: 100
  log_every: 1
  seed: 301
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8
  emit_hard_stop: false

ppo:
  lr_peak: 0.00008
  lr_warmup_steps: 500
  lr_decay_steps: 120000
  lr_floor: 0.000005
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.008
  ent_coef_emit: 0.002
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 0
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
