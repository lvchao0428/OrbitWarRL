# Multi-fleet self-play training config (v3 successor to selfplay.yaml).
#
# Key design choices (all validated by short Mac runs):
#   * EmitHead `continue_bias=0` (default in heads.py) -- starting biased
#     toward many emits caused the random init to bleed ships everywhere
#     and the policy never recovered. With bias=0 the policy starts at
#     ~50/50 emit, learns to settle at ~1.3-1.6 fleets/turn vs random,
#     and the WR climbs cleanly.
#   * Dense potential-based shaping in env/rewards.py (SHAPING_SCALE=0.1)
#     so the value/policy heads get gradient before the +/-1 terminal.
#   * DstHead now allows targeting own planets (reinforcement) -- the
#     game rules treat same-owner arrivals as garrison adds.
#   * `clip_eps=0.15`, `update_epochs=2`, `lr_peak=1.5e-4` for K=8 stability
#     (K-step turn-logp is a sum of up to 4*K=32 categorical logps; small
#     param changes cause much larger ratio swings than the K=1 MVP).
#   * `ent_coef_emit=0.03` keeps the emit head from collapsing too fast.
#
# Schedule:
#   updates [0, warmup_updates)         -> vs random       (warm start)
#   updates [warmup_updates, num_updates) -> mix random/frozen by frozen_ratio

train:
  num_envs: 32
  rollout_length: 128
  num_updates: 400
  num_groups: 5
  episode_steps: 200
  eval_every: 10
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action
  ckpt_every: 25
  log_every: 1
  seed: 44
  d_model: 64
  n_layers: 2
  n_heads: 4
  ff_dim: 128
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 60
  lr_decay_steps: 400
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.5
  ent_coef_src: 0.005
  ent_coef_dst: 0.01
  ent_coef_pct: 0.02
  ent_coef_emit: 0.03
  max_grad_norm: 0.5
  gamma: 0.997
  gae_lambda: 0.95
  update_epochs: 2
  num_minibatches: 4

selfplay:
  enabled: true
  warmup_updates: 40
  snapshot_every: 10
  pool_capacity: 5
  frozen_ratio: 0.5
  eval_vs_frozen: true
