# v11_f27 — f26 pair heads + fixed pct pair feature (Day7+).
#
# Same encoder + head dims as f26 (planet=28, fleet=10, global=17, K=8).
# Fix: pct pair feature [0] changed from misleading (garr+1)/remaining
# (correlates with bin0 when home has 100+ ships) to min_bin_norm — the
# smallest pct-bin index that sends enough ships to flip the target.
#
# f26 @799 replay: bin0=38%, spf=2.64, garr=42, flip=0.74%, WLD=0/5.
# Root cause: pair_needed_pct ~0.05 on home planet → model locked bin0.
#
# Also restores ent_coef_pct=0.006 (f25 level; f26 used 0.004).

train:
  num_envs: 128
  rollout_length: 256
  num_updates: 800
  num_groups: 5
  episode_steps: 500
  eval_every: 50
  eval_num_envs: 32
  ckpt_dir: ./ckpt_multi_action_v11_f27
  ckpt_every: 100
  log_every: 1
  seed: 271
  d_model: 128
  n_layers: 2
  n_heads: 4
  ff_dim: 512
  max_fleets_per_turn: 8

ppo:
  lr_peak: 0.00015
  lr_warmup_steps: 2000
  lr_decay_steps: 150000
  lr_floor: 0.00001
  clip_eps: 0.15
  value_clip_eps: 0.15
  value_coef: 0.20
  ent_coef_src: 0.003
  ent_coef_dst: 0.001
  ent_coef_pct: 0.006
  ent_coef_emit: 0.003
  max_grad_norm: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 32

selfplay:
  enabled: true
  warmup_updates: 50
  snapshot_every: 50
  pool_capacity: 8
  frozen_ratio: 0.40
  eval_vs_frozen: true
  strong_ckpt_path: ""
  strong_ratio: 0.0
